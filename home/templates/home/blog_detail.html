{% extends 'home/base.html' %}
{% block content %}
<a href="{% url 'blog_list' %}" class="text-sm text-blue-600">&larr; Back to Blog</a>
<h1 class="text-3xl font-bold mt-4 mb-2">{{ post.title }}</h1>
<p class="text-sm text-gray-500 mb-6">{{ post.created_at|date:"M d, Y" }}</p>
<div class="prose max-w-none">{{ post.content|linebreaks }}</div>
{% endblock %}
