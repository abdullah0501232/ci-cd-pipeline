{% extends 'home/base.html' %}
{% block content %}
<h1 class="text-3xl font-bold mb-8">Contact</h1>
<form method="post" class="max-w-md space-y-4">
    {% csrf_token %}
    {{ form.as_p }}

</form>
{% endblock %}
